// This is the root directory of the Godot Android gradle build.
pluginManagement {
    apply from: 'config.gradle'

    plugins {
        id 'com.android.application' version versions.androidGradlePlugin
        id 'org.jetbrains.kotlin.android' version versions.kotlinVersion
        id 'org.jetbrains.kotlin.jvm' version versions.kotlinVersion
        id 'org.jetbrains.kotlin.plugin.serialization' version versions.kotlinVersion
        id 'com.google.protobuf' version '0.9.4'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://central.sonatype.com/repository/maven-snapshots/"}
    }
}

include ':assetPackInstallTime'
include ':steam-protocol'
include ':steam-content'
