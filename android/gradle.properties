# Godot gradle build settings.
# These properties apply when running a gradle build from the Godot editor.
# NOTE: This should be kept in sync with 'godot/platform/android/java/gradle.properties' except
# where otherwise specified.

# For more details on how to configure your build environment visit
# https://www.gradle.org/docs/current/userguide/build_environment.html

android.enableJetifier=true
android.useAndroidX=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

org.gradle.warning.mode=all

# Enable resource optimizations for release build.
# NOTE: This is turned off for template release build in order to support the build legacy process.
android.enableResourceOptimizations=true

# Fix gradle build errors when the build path contains non-ASCII characters
android.overridePathCheck=true

# STS2 restructured Android shell build config
# Keep the public app id aligned with the old Android port for now so copied
# shortcuts and C# Java bridges keep targeting com.godot.game.* classes.
export_package_name=com.megacrit.sts2re
export_enabled_abis=arm64-v8a
export_edition=mono
export_build_type=release
export_version_name=v0.1.5
export_version_code=6
perform_zipalign=true
perform_signing=true
# Local signing defaults are supplied by tools/package/*.sh from local.properties
# or RELEASE_KEYSTORE_* environment variables. Keep repository defaults relative
# and non-secret.
debug_keystore_file=
debug_keystore_password=android
debug_keystore_alias=androiddebugkey
release_keystore_file=
# Set these in local.properties, ~/.gradle/gradle.properties, -P arguments, or CI secrets:
#   release_keystore_file=<path/to/keystore>
#   release_keystore_password=<your_password>
#   release_keystore_alias=<your_alias>
